name: Build APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Khóa ký app (giống các app trước): lấy từ Settings > Secrets and variables > Actions
      - name: Chuẩn bị khóa ký
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Đã có khóa ký."
          else
            echo "::warning::Chưa có KEYSTORE_BASE64 — file AAB sẽ chưa ký, chưa đăng lên Play được."
          fi

      - name: In mã SHA-1 của khóa ký (dán vào Firebase để đăng nhập Google)
        if: env.KEYSTORE_FILE != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          SHA=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep 'SHA1:' | sed 's/.*SHA1: //')
          echo "======================================================"
          echo " SHA-1 khóa tải lên (upload key): $SHA"
          echo "======================================================"
          echo "### SHA-1 khóa ký: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Dán vào Firebase > Project settings > Your apps > Android app > Add fingerprint." >> "$GITHUB_STEP_SUMMARY"

      - name: Dựng APK (cài thử) và AAB (đăng Play)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: tester12-free
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
