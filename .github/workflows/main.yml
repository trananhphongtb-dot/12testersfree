name: Build APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Chuẩn bị khóa ký
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Đã có khóa ký."
          else
            echo "::warning::Chưa có KEYSTORE_BASE64 — file AAB sẽ chưa ký, chưa đăng lên Play được."
          fi

      - name: In mã SHA-1 của khóa ký
        if: env.KEYSTORE_FILE != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          SHA=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep 'SHA1:' | sed 's/.*SHA1: //')
          echo "### SHA-1 khóa ký: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Dán vào Firebase > Project settings > Your apps > Android app > Add fingerprint." >> "$GITHUB_STEP_SUMMARY"

      - name: Dựng APK Release và AAB (Không build Debug)
        working-directory: ./tester12
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      # Tạo thư mục chung và gom file vào
      - name: Gom file APK và AAB vào chung thư mục 12testersfree
        run: |
          mkdir -p 12testersfree
          cp tester12/app/build/outputs/apk/release/*.apk 12testersfree/ || true
          cp tester12/app/build/outputs/bundle/release/*.aab 12testersfree/ || true

      # Xuất file
      - uses: actions/upload-artifact@v4
        with:
          name: 12testersfree
          path: 12testersfree/
