plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.tester12.free'
    compileSdk 36

    defaultConfig {
        // ĐỔI applicationId nếu muốn (phải là duy nhất trên Google Play, đổi rồi không đổi lại được)
        applicationId 'vn.tester12.free'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '2.2.0'
        manifestPlaceholders = [appLabel: '@string/app_name']
    }

    signingConfigs {
        release {
            // Lấy từ GitHub Secrets (xem README). Nếu chưa có thì bản release không ký.
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks != null && new File(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        // Bản thử (app-debug.apk): cài song song với bản đang chạy trên Google Play,
        // tên gói vn.tester12.free.beta, tên "12 Testers Beta", ký bằng cùng khóa tải lên.
        debug {
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
            manifestPlaceholders = [appLabel: '12 Testers Beta']
            def ksd = System.getenv('KEYSTORE_FILE')
            if (ksd != null && new File(ksd).exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks != null && new File(ks).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Đăng nhập bằng tài khoản Google trên máy (bảng chọn tài khoản của Android)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    // Kiểm tra ngầm để báo app mới / người test mới
    implementation 'androidx.work:work-runtime:2.9.1'
    // Đọc chữ trong ảnh chụp màn hình (chạy trên máy, không cần mạng)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
